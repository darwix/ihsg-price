name: Scrape minute prices

on:
  schedule:
    - cron: "30 10 * * 1-5" # 17:30 WIB, weekdays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - run: ihsg-price
      - run: python -m ihsg_price.coverage
      - name: Commit updated data and coverage
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/minutes/
          git add data/metadata.json
          git add README.md
          git diff --cached --quiet || git commit -m "data: update minute prices"
          git push
